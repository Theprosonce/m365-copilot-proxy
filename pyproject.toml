[project]
name = "copilot-proxy-server"
dynamic = ["version"]
description = "OpenAI-compatible shim for Microsoft 365 Copilot Chat"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116.0,<1.0.0",
    "httpx>=0.28.0,<1.0.0",
    "pydantic-settings>=2.10.0,<3.0.0",
    "uvicorn>=0.35.0,<1.0.0",
    "websockets>=12.0,<15.0",
]

[project.scripts]
copilot-proxy-server = "copilot_proxy_server.cli:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

# Single source of truth: version is read from copilot_proxy_server.__version__.
[tool.hatch.version]
path = "src/copilot_proxy_server/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/copilot_proxy_server"]

# Ship runtime resources from their canonical project locations.
[tool.hatch.build.targets.wheel.force-include]
"config/substrate.json" = "copilot_proxy_server/substrate.json"
"config/config.ini.template" = "copilot_proxy_server/config.ini.template"
"assets/icon.png" = "copilot_proxy_server/icon.png"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_model: opencode test with real model (requires network access and valid credentials)"
]

[dependency-groups]
dev = [
    "pytest>=8.4.0,<9.0.0",
]
