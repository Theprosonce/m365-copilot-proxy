services:
  chromium:
    build: ./docker/browser
    restart: unless-stopped
    shm_size: 1gb
    volumes:
      - chromium-profile:/data
      - ./docker/browser/entrypoint.sh:/entrypoint.sh:ro
    ports:
      # noVNC is remotely reachable; restrict TCP 6080 with the host firewall.
      - "${VNC_BIND:-0.0.0.0}:6080:6080"
      # Chrome DevTools is used internally by the proxy and stays host-local.
      - "127.0.0.1:9222:9222"

volumes:
  chromium-profile:
